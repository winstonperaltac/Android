# Detrás del proxy de Render, Apache construiría redirecciones con su puerto interno
# (p. ej. /install -> http://host:10000/install/), que el navegador no puede abrir.
# Se desactiva la redirección automática de carpetas y se hace con https y sin puerto.
UseCanonicalName Off
<Directory /var/www/html>
  DirectorySlash Off
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteCond %{REQUEST_URI} !/$
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L]
</Directory>
